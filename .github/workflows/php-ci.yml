name: Validação inicial
on:
  push:
    branches: ["feature/**", "main"]
  pull_request:
    branches: ["main"]
jobs:
  syntax-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
      - name: PHP lint
        run: |
          find app config public scripts tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Testes de validação
        run: php tests/filters.php
      - name: JavaScript syntax
        run: node --check public/assets/js/app.js
